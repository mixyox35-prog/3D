<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Hand Magic</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; color: white;
        }
        #startButton {
            padding: 15px 30px; font-size: 20px; background: #00FFFF;
            border: none; cursor: pointer; border-radius: 50px;
            font-weight: bold; box-shadow: 0 0 20px #00FFFF; margin-top: 20px;
        }
        
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.7); padding: 15px;
            border-radius: 8px; color: #fff; z-index: 100; display: none;
        }
        button.shape-btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 5px 10px; margin: 2px; cursor: pointer;
        }
        button.shape-btn:hover { background: #00FFFF; color: #000; }
        #videoElement { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Single Hand Magic</h1>
        <p>Control Particles with 1 Hand (Pinch to Resize)</p>
        <button id="startButton">START CAMERA</button>
    </div>

    <div id="controls">
        <div style="margin-bottom:10px;">
            <strong>Shapes:</strong><br>
            <button class="shape-btn" onclick="setShape('SPHERE')">Sphere</button>
            <button class="shape-btn" onclick="setShape('CUBE')">Cube</button>
            <button class="shape-btn" onclick="setShape('GALAXY')">Galaxy</button>
        </div>
        <div>
            <strong>Color:</strong> <input type="color" id="colorInput" value="#ff0055">
        </div>
        <div id="status" style="margin-top:10px; color:#00ff00; font-size:12px;">Waiting for hand...</div>
    </div>

    <video id="videoElement"></video>
    <div id="container"></div>

<script>
    let scene, camera, renderer, particles, geometry, material;
    
    // Tracking Variables
    let pinchDistance = 0.5; // Controls Scale (0 to 1)
    let handX = 0;           // Controls Position X
    let handY = 0;           // Controls Position Y
    let isHandDetected = false;

    const numParticles = 12000;

    // --- 1. THREE.JS SETUP ---
    function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);
        camera.position.z = 20;

        createParticles('SPHERE');
        animate();
    }

    // --- 2. CREATE PARTICLES ---
    function createParticles(shape) {
        if(particles) scene.remove(particles);

        geometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        const baseColor = new THREE.Color(document.getElementById('colorInput').value);

        for(let i=0; i<numParticles; i++) {
            let x, y, z;
            if(shape === 'SPHERE') {
                const r = 6;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                x = r * Math.sin(phi) * Math.cos(theta);
                y = r * Math.sin(phi) * Math.sin(theta);
                z = r * Math.cos(phi);
            } else if (shape === 'CUBE') {
                const s = 10;
                x = (Math.random() - 0.5) * s;
                y = (Math.random() - 0.5) * s;
                z = (Math.random() - 0.5) * s;
            } else { // GALAXY
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 10;
                x = Math.cos(angle) * radius;
                y = (Math.random() - 0.5) * 3;
                z = Math.sin(angle) * radius;
            }
            positions.push(x, y, z);
            colors.push(baseColor.r, baseColor.g, baseColor.b);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        material = new THREE.PointsMaterial({
            size: 0.1, vertexColors: true, blending: THREE.AdditiveBlending,
            transparent: true, opacity: 0.8
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);
    }

    function setShape(shape) { createParticles(shape); }
    document.getElementById('colorInput').addEventListener('input', () => createParticles('SPHERE'));

    // --- 3. ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        if(particles) {
            // A. Rotation (Always spinning slowly)
            particles.rotation.y += 0.003;
            particles.rotation.z += 0.001;

            if(isHandDetected) {
                // B. Position Tracking (Follow Hand)
                // Smooth Movement (Lerp)
                particles.position.x += (handX - particles.position.x) * 0.1;
                particles.position.y += (handY - particles.position.y) * 0.1;

                // C. Scale Control (Pinch)
                // Pinch Open (High Dist) -> Scale Big
                // Pinch Closed (Low Dist) -> Scale Small
                let targetScale = 0.2 + (pinchDistance * 3); 
                particles.scale.setScalar(
                    particles.scale.x + (targetScale - particles.scale.x) * 0.1
                );
            } else {
                // Idle state (Center and Normal size)
                particles.position.x += (0 - particles.position.x) * 0.05;
                particles.position.y += (0 - particles.position.y) * 0.05;
                particles.scale.setScalar(
                    particles.scale.x + (1 - particles.scale.x) * 0.05
                );
            }
        }
        renderer.render(scene, camera);
    }

    // --- 4. CAMERA & SINGLE HAND LOGIC ---
    const videoElement = document.getElementById('videoElement');

    async function startCameraApp() {
        document.getElementById('startButton').innerText = "Starting...";
        
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});

        hands.setOptions({
            maxNumHands: 1, // Single Hand Mode
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                // 1. POSITION: Track Index Finger Tip (Landmark 8)
                const indexTip = landmarks[8];
                // Map 0-1 coords to Three.js World Coords (approx -20 to +20)
                // Note: X is flipped because camera is mirrored
                handX = (0.5 - indexTip.x) * 35; 
                handY = (0.5 - indexTip.y) * 25; 

                // 2. PINCH: Distance between Thumb Tip (4) and Index Tip (8)
                const thumbTip = landmarks[4];
                const dx = thumbTip.x - indexTip.x;
                const dy = thumbTip.y - indexTip.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // Map Distance (approx 0.02 to 0.2) to 0-1 range
                // Pinch Closed (~0.02) -> 0
                // Pinch Open (~0.2) -> 1
                pinchDistance = Math.min(1, Math.max(0, (dist - 0.02) * 6));
                
                document.getElementById('status').innerText = "Tracking Hand | Pinch: " + Math.round(pinchDistance * 100) + "%";
            } else {
                isHandDetected = false;
                document.getElementById('status').innerText = "Show your hand...";
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 640, height: 480
        });

        try {
            await camera.start();
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            initThree();
        } catch (error) {
            alert("Error: " + error.message);
        }
    }

    document.getElementById('startButton').addEventListener('click', startCameraApp);
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
