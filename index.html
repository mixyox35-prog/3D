<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Particles (Fixed)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* Start Overlay Styling */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 20px;
            background: #00FFFF;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 0 20px #00FFFF;
            margin-top: 20px;
        }
        #startButton:hover { transform: scale(1.1); }

        /* Controls Styling */
        #controls {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 8px; color: #fff;
            z-index: 100; display: none; /* Initially hidden */
        }
        button.shape-btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 5px 10px; margin: 2px; cursor: pointer;
        }
        button.shape-btn:hover { background: #00FFFF; color: #000; }
        
        #videoElement { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Interactive 3D Particles</h1>
        <p>This app requires Camera Access to track your hands.</p>
        <button id="startButton">START CAMERA</button>
        <p style="font-size: 12px; color: #888; margin-top: 20px;">
            Note: Use Local Server (http://localhost) not file://
        </p>
    </div>

    <div id="controls">
        <div style="margin-bottom:10px;">
            <strong>Shapes:</strong><br>
            <button class="shape-btn" onclick="setShape('SPHERE')">Sphere</button>
            <button class="shape-btn" onclick="setShape('CUBE')">Cube</button>
            <button class="shape-btn" onclick="setShape('GALAXY')">Galaxy</button>
        </div>
        <div>
            <strong>Color:</strong> <input type="color" id="colorInput" value="#00ffff">
        </div>
        <div id="status" style="margin-top:10px; color:#00ff00; font-size:12px;">Waiting...</div>
    </div>

    <video id="videoElement"></video>
    <div id="container"></div>

<script>
    let scene, camera, renderer, particles, geometry, material;
    let handDistance = 0; 
    let isTracking = false;
    const numParticles = 15000;

    // --- 1. THREE.JS INIT ---
    function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);
        camera.position.z = 15;

        // Add Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        createParticles('SPHERE');
        animate();
    }

    // --- 2. PARTICLE SYSTEM ---
    function createParticles(shape) {
        if(particles) scene.remove(particles);

        geometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        const baseColor = new THREE.Color(document.getElementById('colorInput').value);

        for(let i=0; i<numParticles; i++) {
            let x, y, z;
            
            if(shape === 'SPHERE') {
                const r = 5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                x = r * Math.sin(phi) * Math.cos(theta);
                y = r * Math.sin(phi) * Math.sin(theta);
                z = r * Math.cos(phi);
            } else if (shape === 'CUBE') {
                const s = 8;
                x = (Math.random() - 0.5) * s;
                y = (Math.random() - 0.5) * s;
                z = (Math.random() - 0.5) * s;
            } else { // GALAXY
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 8;
                // Spiral effect
                x = Math.cos(angle + radius) * radius; 
                y = (Math.random() - 0.5) * 2;
                z = Math.sin(angle + radius) * radius;
            }

            // Add randomness (Jitter)
            x += (Math.random() - 0.5);
            y += (Math.random() - 0.5);
            z += (Math.random() - 0.5);

            positions.push(x, y, z);
            colors.push(baseColor.r, baseColor.g, baseColor.b);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        material = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);
    }

    function setShape(shape) { createParticles(shape); }

    document.getElementById('colorInput').addEventListener('input', () => {
        createParticles('SPHERE'); // Refresh to apply color
    });

    // --- 3. ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        if(particles) {
            particles.rotation.y += 0.002;
            
            // Interaction: Expansion based on Hand Distance
            // handDistance goes 0 -> 1. 
            // We want Scale 1 -> 3
            let targetScale = 1 + (handDistance * 2); 
            
            // Smooth lerp
            particles.scale.x += (targetScale - particles.scale.x) * 0.1;
            particles.scale.y += (targetScale - particles.scale.y) * 0.1;
            particles.scale.z += (targetScale - particles.scale.z) * 0.1;
        }
        renderer.render(scene, camera);
    }

    // --- 4. CAMERA & MEDIAPIPE LOGIC ---
    const videoElement = document.getElementById('videoElement');

    async function startCameraApp() {
        document.getElementById('startButton').innerText = "Loading AI...";
        
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if(results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                document.getElementById('status').innerText = "Tracking: 2 Hands Detected";
                
                // Calculate distance between index tips
                const h1 = results.multiHandLandmarks[0][8];
                const h2 = results.multiHandLandmarks[1][8];
                
                const dx = h1.x - h2.x;
                const dy = h1.y - h2.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // Map dist (approx 0.05 to 0.6) to 0-1
                handDistance = Math.max(0, Math.min(1, (dist - 0.1) * 2));
            } else {
                document.getElementById('status').innerText = "Show BOTH hands to control size";
                handDistance = 0; // Reset
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        try {
            await camera.start();
            // Start success
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            initThree();
        } catch (error) {
            alert("Camera Error: " + error.message + "\nPlease use Localhost, not file://");
            document.getElementById('startButton').innerText = "FAILED (See Alert)";
        }
    }

    // Button Click Listener
    document.getElementById('startButton').addEventListener('click', startCameraApp);

    // Resize Handler
    window.addEventListener('resize', () => {
        if(camera) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    });

</script>
</body>
</html>
