<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Controlled Particle System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            z-index: 100;
            max-width: 250px;
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.3);
        }
        .control-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #00FFFF; }
        button {
            background: #222;
            color: #00FFFF;
            border: 1px solid #00FFFF;
            padding: 5px 10px;
            margin: 3px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { background: #00FFFF; color: #000; }
        #status { color: #FF00FF; margin-top: 10px; font-size: 14px; }
        #videoElement { display: none; }
    </style>
</head>
<body>

    <div id="controls">
        <h2>Particle Controls</h2>
        <div class="control-group">
            <label>Shape Template:</label>
            <div id="shapeButtons">
                <button data-shape="SPHERE">Sphere</button>
                <button data-shape="HEART">Heart</button>
                <button data-shape="BOX">Box</button>
                <button data-shape="FIREWORKS">Fireworks</button>
            </div>
        </div>
        <div class="control-group">
            <label for="colorPicker">Particle Color:</label>
            <input type="color" id="colorPicker" value="#00ffff">
        </div>
        <div id="status">Loading AI Model...</div>
    </div>
    
    <video id="videoElement"></video>
    <div id="container"></div>

<script>
    let scene, camera, renderer;
    let particles, particleGeometry, particleMaterial;
    let handX = 0, handY = 0, handZ = 0;
    let currentShape = 'SPHERE';
    const numParticles = 20000;

    // --- Mediapipe Variables ---
    const videoElement = document.getElementById('videoElement');
    let handDistance = 0; // Distance between hands (tension control)

    // --- 1. CORE THREE.JS SETUP ---
    function initThreeJS() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);
        
        camera.position.z = 10;
        
        // Setup initial particles
        initParticles(currentShape);
        
        window.addEventListener('resize', onWindowResize, false);
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- 2. PARTICLE GEOMETRY & MATERIAL ---
    function initParticles(shape) {
        if (particles) {
            scene.remove(particles);
            particleGeometry.dispose();
        }

        particleGeometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        const color = new THREE.Color(document.getElementById('colorPicker').value);

        // Generate points based on shape template
        for (let i = 0; i < numParticles; i++) {
            let x, y, z;
            
            // Generate Points Logic (Simplified Templates)
            switch (shape) {
                case 'SPHERE':
                    const radius = 5;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const theta = Math.random() * Math.PI * 2;
                    x = radius * Math.cos(theta) * Math.sin(phi);
                    y = radius * Math.sin(theta) * Math.sin(phi);
                    z = radius * Math.cos(phi);
                    break;
                case 'HEART': // Placeholder for complex shape generation (simplified Box for now)
                case 'BOX':
                    const size = 3;
                    x = (Math.random() - 0.5) * size * 2;
                    y = (Math.random() - 0.5) * size * 2;
                    z = (Math.random() - 0.5) * size * 2;
                    break;
                case 'FIREWORKS': // Concentrated center
                    x = (Math.random() - 0.5) * 10 * Math.random();
                    y = (Math.random() - 0.5) * 10 * Math.random();
                    z = (Math.random() - 0.5) * 10 * Math.random();
                    break;
                default:
                    x = (Math.random() - 0.5) * 10;
                    y = (Math.random() - 0.5) * 10;
                    z = (Math.random() - 0.5) * 10;
            }
            positions.push(x, y, z);
            colors.push(color.r, color.g, color.b);
        }

        particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        // Use a sprite map for a glowing effect (we skip loading texture for simplicity)
        particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            blending: THREE.AdditiveBlending, // Glow effect
            transparent: true,
            sizeAttenuation: true
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        currentShape = shape;
    }

    // --- 3. MEDIAPIPE HAND TRACKING ---
    function initHands() {
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2, // Track both hands
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onHandsResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
        document.getElementById('status').innerText = "Camera Active. Show your hands!";
    }

    function onHandsResults(results) {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length < 2) {
            // No or single hand detected, reset distance to neutral
            handDistance = 0.5; 
            document.getElementById('status').innerText = "Show both hands for control.";
            return;
        }

        document.getElementById('status').innerText = "Both hands detected.";

        // We use the distance between the Index Finger Tips (Landmark 8) of both hands
        const hand1_idx_tip = results.multiHandLandmarks[0][8];
        const hand2_idx_tip = results.multiHandLandmarks[1][8];
        
        // Calculate the 2D distance between the two index finger tips
        const dx = hand1_idx_tip.x - hand2_idx_tip.x;
        const dy = hand1_idx_tip.y - hand2_idx_tip.y;
        
        // Normalize distance (0 to 1)
        let dist = Math.sqrt(dx * dx + dy * dy);
        
        // Normalize the distance to a control value (0.05 min separation to 0.7 max separation)
        const min_d = 0.05;
        const max_d = 0.7;
        
        handDistance = Math.max(0, Math.min(1, (dist - min_d) / (max_d - min_d)));
        
        // handDistance is now: 0 (hands close) to 1 (hands far apart)
    }

    // --- 4. ANIMATION AND INTERACTION LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        // Map handDistance (0 to 1) to Particle Scale/Expansion
        // EXPANSION CONTROL: Hands CLOSE (0) -> Scale UP (2.5)
        // Hands FAR (1) -> Scale DOWN (0.5)
        
        // Reverse the handDistance for the control logic
        const reversedControl = 1 - handDistance; // 0 (far) to 1 (close)
        
        const minScale = 0.5;
        const maxScale = 2.5;
        const scaleFactor = minScale + (reversedControl * (maxScale - minScale));

        if (particles) {
            particles.scale.set(scaleFactor, scaleFactor, scaleFactor);
            particles.rotation.y += 0.005;
        }

        renderer.render(scene, camera);
    }
    
    // --- 5. GUI & EVENT LISTENERS ---
    function initGUI() {
        // Shape Buttons
        document.getElementById('shapeButtons').addEventListener('click', (event) => {
            if (event.target.tagName === 'BUTTON') {
                const newShape = event.target.getAttribute('data-shape');
                initParticles(newShape);
            }
        });
        
        // Color Picker
        document.getElementById('colorPicker').addEventListener('input', (event) => {
            const newColor = new THREE.Color(event.target.value);
            // Update material color for the next particles
            if (particleMaterial) {
                particleMaterial.color.set(newColor);
            }
            // Re-initialize particles to apply color to geometry vertex
            initParticles(currentShape); 
        });
    }

    // --- RUN EVERYTHING ---
    initThreeJS();
    initGUI();
    initHands();
    animate();
</script>
</body>
</html>
